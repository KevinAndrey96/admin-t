# Panel plus a disposable WordPress + WooCommerce store with demo data.
# Store:  http://localhost:8081   Panel:  http://localhost:8080
# The credentials to sign in are printed by `docker compose logs store-setup`.

services:
  panel:
    build: .
    ports:
      - "8080:8080"
    environment:
      WOOCOMMERCE_URL: http://wordpress
      WOOCOMMERCE_PUBLIC_URL: http://localhost:8081
      STORE_NAME: Tienda demo
      APP_KEY: ${APP_KEY:?run `make env` to create .env with APP_KEY}
      APP_SECURE_COOKIES: "false"
      APP_TIMEZONE: America/Bogota
    depends_on:
      store-setup:
        condition: service_completed_successfully

  wordpress:
    image: wordpress:7.0-php8.4-apache
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-local-only}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wordpress:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      interval: 3s
      retries: 40

  store-setup:
    image: wordpress:cli-2.12-php8.4
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-local-only}
      STORE_URL: http://localhost:8081
      STORE_TITLE: Tienda demo
    volumes:
      - wordpress:/var/www/html
      - ./docker/store-setup.sh:/usr/local/bin/store-setup:ro
    entrypoint: ["sh", "/usr/local/bin/store-setup"]
    depends_on:
      wordpress:
        condition: service_healthy

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-only}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

volumes:
  wordpress:
  database:
