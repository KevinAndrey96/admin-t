services:
  admin-dashboard:
    image: php:8.2-apache
    container_name: woocommerce-admin-dashboard
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-ufun}
      DB_USER: ${DB_USER:-ufun_user}
      DB_PASSWORD: ${DB_PASSWORD:-ufun_password}
    volumes:
      - .:/var/www/html
    entrypoint: >
      sh -c "docker-php-ext-install pdo pdo_mysql &&
             docker-php-entrypoint apache2-foreground"

  # Optional database service when running standalone
  db:
    image: mariadb:10.11
    container_name: admin-t-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ufun
      MYSQL_USER: ufun_user
      MYSQL_PASSWORD: ufun_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
