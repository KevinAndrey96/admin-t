services:
  app:
    image: php:8.2-apache
    container_name: woo-php-admin-panel
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      APP_NAME: "WooCommerce Fast Admin"
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ufun
      DB_USER: ufun_user
      DB_PASSWORD: ufun_password
      DB_CHARSET: utf8mb4
      DB_TABLE_PREFIX: wp_
    volumes:
      - .:/var/www/html
    entrypoint: >
      sh -c "docker-php-ext-install pdo pdo_mysql &&
             a2enmod rewrite &&
             docker-php-entrypoint apache2-foreground"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: woo-admin-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ufun
      MYSQL_USER: ufun_user
      MYSQL_PASSWORD: ufun_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: woo-admin-phpmyadmin
    restart: unless-stopped
    ports:
      - "8086:80"
    environment:
      PMA_HOST: db
      PMA_USER: ufun_user
      PMA_PASSWORD: ufun_password
    depends_on:
      - db

volumes:
  db_data:
