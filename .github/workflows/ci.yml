name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring, sodium
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Estilo (PER-CS)
        if: matrix.php == '8.4'
        run: vendor/bin/php-cs-fixer check --diff
      - name: Análisis estático (PHPStan nivel max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - name: Pruebas
        run: vendor/bin/phpunit
      - name: Sintaxis de JavaScript y shell
        if: matrix.php == '8.4'
        run: |
          node --check public/assets/app.js
          bash -n docker/e2e.sh
          sh -n docker/store-setup.sh

  e2e:
    name: Extremo a extremo con WooCommerce
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: Tienda demo y panel
        run: |
          echo "APP_KEY=base64:$(openssl rand -base64 32)" > .env
          docker compose up -d --build --wait panel
      - name: Flujo completo
        run: bash docker/e2e.sh
      - name: Cabeceras de seguridad
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl -sI localhost:8080/ingresar)
          grep -qi "^content-security-policy: default-src 'self'" <<<"$headers"
          grep -qi '^x-frame-options: DENY' <<<"$headers"
          ! grep -qi '^x-powered-by' <<<"$headers"
          test "$(docker inspect --format '{{.Config.User}}' "$(docker compose ps -q panel)")" = www-data
      - if: failure()
        run: docker compose logs
